<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="70" fill="rgba(255, 255, 255, 0.03)" stroke="url(#accentGrad)" stroke-width="2" />
  
  <!-- Stylized Steaming Bowl (Repas) -->
  <path d="M160,175 C160,210 240,210 240,175 Z" fill="#f97316" opacity="0.8" />
  <line x1="150" y1="175" x2="250" y2="175" stroke="#f97316" stroke-width="4" stroke-linecap="round" />
  <!-- Steam lines -->
  <path d="M180,160 Q185,150 180,140" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <path d="M200,160 Q205,145 200,135" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <path d="M220,160 Q225,150 220,140" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />

  <text x="200" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20" fill="#ffffff" letter-spacing="1">
    NOURRITURE
  </text>
  <text x="200" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="0.5">
    Image à compléter
  </text>
</svg>
