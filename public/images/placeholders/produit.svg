<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="70" fill="rgba(255, 255, 255, 0.03)" stroke="url(#accentGrad)" stroke-width="2" />
  
  <!-- Stylized Shopping Bag -->
  <rect x="175" y="150" width="50" height="55" rx="5" fill="#f97316" opacity="0.8" />
  <path d="M185,150 C185,135 215,135 215,150" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
  <!-- Accent pocket line -->
  <line x1="175" y1="168" x2="225" y2="168" stroke="#0f172a" stroke-width="2" />

  <text x="200" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20" fill="#ffffff" letter-spacing="1">
    PRODUIT
  </text>
  <text x="200" y="320" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="0.5">
    Image à compléter
  </text>
</svg>
